name: Build desktop applications

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application and build dependencies
        run: python -m pip install -e ".[build]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v

      - name: Build standalone executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name CSVCompare
          --distpath dist
          --workpath build/pyinstaller
          --specpath build
          csv_compare.py

      - name: Package executable and README
        run: python package_binary.py

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: CSVCompare-${{ runner.os }}-${{ runner.arch }}
          path: dist/CSVCompare-*.zip
          if-no-files-found: error
          retention-days: 30
