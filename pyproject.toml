[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvviewer"
version = "0.1.0"
description = "Desktop application for comparing CSV files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6.10,<7",
    "Pillow>=10,<13",
]

[project.scripts]
csv-compare = "csv_compare:main"

[tool.setuptools]
py-modules = ["csv_compare", "comparison_history"]

[tool.setuptools.packages.find]
include = ["ui", "ui.*"]
